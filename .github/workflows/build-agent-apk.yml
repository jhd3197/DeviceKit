name: Build DeviceKit Agent APK

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APKs'
        required: false
        default: true
        type: boolean
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: 'dev'
        type: string

permissions:
  contents: write

env:
  NDK_VERSION: '27.0.12077973'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # The Faro protocol module embeds Rust (faro-agentd via JNI); cargo-ndk
      # cross-compiles it during the Gradle build.
      - name: Install Android NDK
        run: |
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Add Rust Android targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk*
            agent-android/faro-protocol/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('agent-android/faro-protocol/rust/Cargo.lock') }}

      - name: Install cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked

      # The repo's own wrapper is 8.13 (AGP 8.13.2 requires >= 8.13); use it
      # as-is instead of regenerating with an older Gradle.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs (both editions)
        run: ./gradlew assembleFullDebug assembleFaroDebug

      - name: Build release APKs (both editions)
        run: ./gradlew assembleFullRelease assembleFaroRelease

      - name: Rename APKs for release
        run: |
          VERSION="${{ github.event.inputs.version || 'dev' }}"
          if [[ "${{ github.ref }}" == refs/tags/agent-v* ]]; then
            VERSION="${GITHUB_REF_NAME#agent-v}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/full/debug/*.apk   "release/DeviceKitAgent-${VERSION}-debug.apk"
          cp app/build/outputs/apk/full/release/*.apk "release/DeviceKitAgent-${VERSION}-release.apk"
          cp app/build/outputs/apk/faro/debug/*.apk   "release/FaroAgent-${VERSION}-debug.apk"
          cp app/build/outputs/apk/faro/release/*.apk "release/FaroAgent-${VERSION}-release.apk"

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceKitAgent-APKs
          path: agent-android/release/*.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DeviceKit Agent ${{ github.ref_name }}"
          files: agent-android/release/*.apk
          generate_release_notes: true

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "agent-v${{ github.event.inputs.version }}"
          name: "DeviceKit Agent v${{ github.event.inputs.version }}"
          files: agent-android/release/*.apk
          generate_release_notes: true
