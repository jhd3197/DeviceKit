name: Build DeviceKit Agent APK

on:
  push:
    tags:
      - 'agent-v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release with the APKs'
        required: false
        default: true
        type: boolean
      version:
        description: 'Version label (e.g. 1.0.0)'
        required: false
        default: 'dev'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Rename APKs for release
        run: |
          VERSION="${{ github.event.inputs.version || 'dev' }}"
          if [[ "${{ github.ref }}" == refs/tags/agent-v* ]]; then
            VERSION="${GITHUB_REF_NAME#agent-v}"
          fi
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk "release/DeviceKitAgent-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/*.apk "release/DeviceKitAgent-${VERSION}-release.apk"

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeviceKitAgent-APKs
          path: agent-android/release/*.apk

      - name: Create GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/agent-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "DeviceKit Agent ${{ github.ref_name }}"
          files: agent-android/release/*.apk
          generate_release_notes: true

      - name: Create GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "agent-v${{ github.event.inputs.version }}"
          name: "DeviceKit Agent v${{ github.event.inputs.version }}"
          files: agent-android/release/*.apk
          generate_release_notes: true
