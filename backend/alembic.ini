# Alembic configuration for DeviceKit.
# The database URL is injected at runtime from config.DEVICEKIT_DATABASE_URL
# (see devicekit/migrate.py and alembic/env.py); the value here is only a fallback
# for manual `alembic` CLI use.
[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///devicekit.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
