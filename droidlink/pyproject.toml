[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "droidlink"
version = "0.1.0"
description = "Python bridge for Android device control via DeviceKit agent"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
droidlink = "droidlink.cli:main"

[project.entry-points."pytest11"]
droidlink = "droidlink.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
