<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <!-- White tile behind the mark (matches the outer squircle silhouette) -->
  <rect x="150" y="150" width="1748" height="1748" rx="150" fill="white"/>
  <!-- Outer squircle ring: outer rounded square minus inner squircle (evenodd donut) -->
  <path fill="url(#brandGradient)" fill-rule="evenodd" d="M378,70 H1670 A308,308 0 0 1 1978,378 V1670 A308,308 0 0 1 1670,1978 H378 A308,308 0 0 1 70,1670 V378 A308,308 0 0 1 378,70 Z M450,220 A230,230 0 0 0 220,450 V1598 A230,230 0 0 0 450,1828 H1598 A230,230 0 0 0 1828,1598 V450 A230,230 0 0 0 1598,220 Z"/>
  <!-- Phone body with screen cutout (evenodd hole reveals the white tile as the screen) -->
  <path fill="url(#brandGradient)" fill-rule="evenodd" d="M804,434 H1244 A100,100 0 0 1 1344,534 V1514 A100,100 0 0 1 1244,1614 H804 A100,100 0 0 1 704,1514 V534 A100,100 0 0 1 804,434 Z M810,560 A30,30 0 0 0 780,590 V1390 A30,30 0 0 0 810,1420 H1240 A30,30 0 0 0 1270,1390 V590 A30,30 0 0 0 1240,560 Z"/>
  <!-- Speaker slot on the top bezel -->
  <rect x="944" y="481" width="160" height="32" rx="16" fill="white"/>
  <!-- Home indicator on the bottom bezel -->
  <rect x="924" y="1501" width="200" height="32" rx="16" fill="white"/>
  <!-- Green status LED (family continuity with the Android accent) -->
  <circle cx="1210" cy="632" r="28" fill="#3ddc97"/>
</svg>
