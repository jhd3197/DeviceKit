[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devicekit"
version = "0.1.0"
description = "Android device control and test automation - the DeviceKit Python library"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Juan Denis"},
]
keywords = ["android", "adb", "automation", "testing", "device-farm", "ui-automation", "pytest"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Framework :: Pytest",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://github.com/jhd3197/DeviceKit"
Repository = "https://github.com/jhd3197/DeviceKit"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
devicekit = "devicekit.cli:main"

[project.entry-points."pytest11"]
devicekit = "devicekit.pytest_plugin"

[tool.setuptools.packages.find]
where = ["."]
include = ["devicekit*"]
