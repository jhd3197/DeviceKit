services:
  api:
    build: ./backend
    ports:
      - "5890:7317"
    env_file: .env
    depends_on:
      - dynamodb-local
    environment:
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000

  frontend:
    build: ./frontend
    ports:
      - "3847:80"
    depends_on:
      - api

  dynamodb-local:
    image: amazon/dynamodb-local
    ports:
      - "8321:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb"
